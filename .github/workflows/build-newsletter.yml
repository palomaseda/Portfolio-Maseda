name: Build Newsletter Index

on:
  workflow_dispatch:
  push:
    paths:
      - 'newsletter/**'
      - 'build_newsletter.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF conversion dependencies
        run: pip install pymupdf pillow

      - name: Build newsletter index
        run: python3 build_newsletter.py

      - name: Commit updated index
        run: |
          git add -A data/newsletter.json newsletter/rendered

          if git diff --cached --quiet; then
            echo "No newsletter changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild newsletter index"
          git push
